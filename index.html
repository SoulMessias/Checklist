<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Dinâmico na Nuvem</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        h1 {
            margin-bottom: 24px;
            font-size: 1.8rem;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .card h3 {
            margin: 0 0 8px 0;
            font-size: 0.9rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .card .value {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--primary);
        }

        .form-section {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        .form-section h2 {
            margin-top: 0;
            font-size: 1.2rem;
            margin-bottom: 15px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)) 140px;
            gap: 12px;
            align-items: end;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 0.85rem;
            margin-bottom: 5px;
            color: var(--text-muted);
        }

        .form-group input {
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 16px;
            font-size: 0.95rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            height: 41px;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .table-container {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 14px 20px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: #f9fafb;
            font-weight: 600;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        tbody tr:hover {
            background-color: #f9fafb;
        }
    </style>
</head>
<body onload="carregarDados()">

    <div class="container">
        <h1>Painel Sincronizado (Google Planilhas)</h1>

        <div class="cards-grid">
            <div class="card">
                <h3>Total de Registros</h3>
                <div class="value" id="totalCount">0</div>
            </div>
            <div class="card">
                <h3>Status da Nuvem</h3>
                <div class="value" id="statusNuvem" style="font-size: 1.2rem; color: #10b981; padding-top: 8px;">Conectado</div>
            </div>
        </div>

        <div class="form-section">
            <h2>Adicionar Novo Item na Nuvem</h2>
            <div class="form-grid">
                <div class="form-group"><label>Item</label><input type="text" id="col1"></div>
                <div class="form-group"><label>Descrição</label><input type="text" id="col2"></div>
                <div class="form-group"><label>Categoria</label><input type="text" id="col3"></div>
                <div class="form-group"><label>Valor</label><input type="text" id="col4"></div>
                <div class="form-group"><label>Data</label><input type="text" id="col5"></div>
                <button onclick="adicionarLinha()">Salvar</button>
            </div>
        </div>

        <div class="table-container">
            <table id="dataTable">
                <thead>
                    <tr>
                        <th>Item</th>
                        <th>Descrição</th>
                        <th>Categoria</th>
                        <th>Valor</th>
                        <th>Data</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Os dados da planilha entram aqui automaticamente -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // COLE AQUI A SUA URL DO APPS SCRIPT ENTRE AS ASPAS
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyw8SmxPICzpGnt4VXYAGGENclDdmpmUP-CsrcikfpCvjYJ7WHanhyzLZ-d1g7bNhtTPw/exec';

        async function carregarDados() {
            try {
                const response = await fetch(WEB_APP_URL);
                const data = await response.json();
                
                const tbody = document.querySelector('#dataTable tbody');
                tbody.innerHTML = '';

                // Assume que a primeira linha da planilha são os cabeçalhos, então começamos do i = 1
                for (let i = 1; i < data.length; i++) {
                    const row = data[i];
                    if(row[0]) { // Se tiver conteúdo na primeira coluna
                        const tr = document.createElement('tr');
                        tr.innerHTML = `<td>${row[0]}</td><td>${row[1]}</td><td>${row[2]}</td><td>${row[3]}</td><td>${row[4]}</td>`;
                        tbody.appendChild(tr);
                    }
                }
                document.getElementById('totalCount').innerText = data.length - 1;
            } catch (error) {
                console.error("Erro ao carregar dados:", error);
                document.getElementById('statusNuvem').innerText = "Erro de Conexão";
                document.getElementById('statusNuvem').style.color = "#ef4444";
            }
        }

        async function adicionarLinha() {
            const v1 = document.getElementById('col1').value;
            const v2 = document.getElementById('col2').value;
            const v3 = document.getElementById('col3').value;
            const v4 = document.getElementById('col4').value;
            const v5 = document.getElementById('col5').value;

            if (!v1) {
                alert('Preencha pelo menos o campo Item.');
                return;
            }

            const payload = { col1: v1, col2: v2, col3: v3, col4: v4, col5: v5 };

            document.getElementById('statusNuvem').innerText = "Salvando...";

            try {
                await fetch(WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                alert('Salvo com sucesso na nuvem!');
                
                // Limpa os inputs
                document.getElementById('col1').value = '';
                document.getElementById('col2').value = '';
                document.getElementById('col3').value = '';
                document.getElementById('col4').value = '';
                document.getElementById('col5').value = '';

                // Recarrega os dados da planilha após 1 segundo
                setTimeout(carregarDados, 1500);
                document.getElementById('statusNuvem').innerText = "Conectado";
            } catch (error) {
                console.error("Erro ao salvar:", error);
                alert('Erro ao salvar dados.');
                document.getElementById('statusNuvem').innerText = "Erro";
            }
        }
    </script>
</body>
</html>
