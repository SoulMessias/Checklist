<script>
        // Cole abaixo a URL do Web App gerada no seu Apps Script
        const WEB_APP_BASE_URL = 'https://script.google.com/macros/s/AKfycbyaSkxEYauds71HkFdUh6gCJMipD_2J_mqrmGfdSkwfpR6DjJzLyXScNRoNIBkaQvsnjA/exec';

        // Defina aqui os nomes EXATOS das duas abas da sua planilha
        const ABAS_PLANILHA = {
            "PLANILHA_1": "Página1",       // <-- Nome exato da sua Aba Principal
            "PLANILHA_2": "NomeDaNovaAba"  // <-- Substitua "NomeDaNovaAba" pelo nome exato da segunda aba!
        };

        let abaAtual = "";
        let WEB_APP_URL = "";
        let dadosGlobais = [];
        let filtrosAtivos = {
            linha: new Set(),
            dia: new Set(),
            tipo: new Set()
        };
        let apenasPendentesAtivo = false;
        let ultimoItemClicado = { tipo: null, valor: null };

        let ultimaLinhaSalvaId = null;
        let linhasSelecionadasIds = new Set();

        function selecionarPainel(tipoPlanilha) {
            abaAtual = ABAS_PLANILHA[tipoPlanilha];
            WEB_APP_URL = `${WEB_APP_BASE_URL}?aba=${encodeURIComponent(abaAtual)}`;
            
            if(tipoPlanilha === "PLANILHA_1") {
                document.getElementById('tituloPainel').innerText = "Painel Operacional - Principal";
            } else {
                document.getElementById('tituloPainel').innerText = "Painel Operacional - Secundário";
            }

            document.getElementById('selectionOverlay').style.display = 'none';
            carregarDados();
        }

        function voltarParaSelecao() {
            document.getElementById('selectionOverlay').style.display = 'flex';
            dadosGlobais = [];
            limparFiltros();
        }

        function atualizarPosicaoCabecalhoTabela() {
            const stickyArea = document.getElementById('stickyTopArea');
            const thElement = document.querySelector('thead th');
            if(stickyArea && thElement) {
                const alturaTopo = stickyArea.offsetHeight;
                thElement.style.top = (alturaTopo - document.querySelector('.sticky-top-area .table-card').offsetHeight) + 'px';
            }
        }

        window.addEventListener('resize', atualizarPosicaoCabecalhoTabela);

        async function carregarDados() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = `<tr><td colspan="13" style="text-align: center; color: var(--text-muted); padding: 20px;">A carregar informações da planilha, por favor aguarde...</td></tr>`;
            document.getElementById('statusNuvem').innerText = "A sincronizar...";

            try {
                const resp = await fetch(WEB_APP_URL);
                const data = await resp.json();
                
                if (data.status === "erro") {
                    throw new Error(data.message);
                }

                dadosGlobais = data.slice(1).map((row, index) => ({ rowIndex: index + 2, data: row }));
                
                gerarFiltrosDinamicos();
                renderizarTabela();
                document.getElementById('statusNuvem').innerText = "Conectado ao Google Sheets";

                setTimeout(atualizarPosicaoCabecalhoTabela, 100);

                if (ultimaLinhaSalvaId !== null) {
                    setTimeout(() => {
                        const trAlvo = document.getElementById(`row-${ultimaLinhaSalvaId}`);
                        if (trAlvo) {
                            trAlvo.scrollIntoView({ behavior: 'smooth', block: 'center' });
                            trAlvo.classList.add('linha-focada');
                        }
                        ultimaLinhaSalvaId = null;
                    }, 300);
                }
            } catch (err) {
                console.error("Erro detalhado:", err);
                document.getElementById('statusNuvem').innerText = "Erro de Sincronização";
                tbody.innerHTML = `<tr><td colspan="13" style="text-align: center; color: var(--accent-red); padding: 20px;">Erro ao carregar dados da nuvem. Verifique o nome das abas.</td></tr>`;
            }
        }

        function parseData(valorRaw) {
            if (!valorRaw) return null;
            const str = valorRaw.toString().trim();
            if (str === '' || str === '-') return null;
            
            const isoMatch = str.match(/^(\d{4})-(\d{2})-(\d{2})/);
            if (isoMatch) {
                return new Date(isoMatch[1], isoMatch[2] - 1, isoMatch[3]);
            }
            if (str.includes('/')) {
                const partes = str.split('/');
                if (partes.length === 3) {
                    return new Date(partes[2], partes[1] - 1, partes[0]);
                }
            }
            const dtNum = Number(str);
            if (!isNaN(dtNum) && dtNum > 30000) {
                return new Date((dtNum - (25567 + 2)) * 86400 * 1000);
            }
            return null;
        }

        function formatToInputDate(valorRaw) {
            const dt = parseData(valorRaw);
            if (!dt || isNaN(dt.getTime())) return '';
            const ano = dt.getFullYear();
            const mes = String(dt.getMonth() + 1).padStart(2, '0');
            const dia = String(dt.getDate()).padStart(2, '0');
            return `${ano}-${mes}-${dia}`;
        }

        function formatVigencia(valorRaw) {
            if (valorRaw === undefined || valorRaw === null) return '';
            const str = valorRaw.toString().trim();
            if (str === '' || str === '-') return str;

            const dt = parseData(str);
            if (dt && !isNaN(dt.getTime())) {
                const dia = String(dt.getDate()).padStart(2, '0');
                const mes = String(dt.getMonth() + 1).padStart(2, '0');
                const ano = dt.getFullYear();
                return `${dia}/${mes}/${ano}`;
            }

            return str;
        }

        function formatCell(val) {
            if (val === undefined || val === null) return '';
            const str = val.toString().trim();
            
            const dt = parseData(str);
            if (dt && !isNaN(dt.getTime()) && (/^\d{4}-\d{2}-\d{2}/.test(str) || /^\d{5}$/.test(str) || /^\d{1,2}\/\d{1,2}\/\d{4}$/.test(str))) {
                const dia = String(dt.getDate()).padStart(2, '0');
                const mes = String(dt.getMonth() + 1).padStart(2, '0');
                const ano = dt.getFullYear();
                return `${dia}/${mes}/${ano}`;
            }

            return str;
        }

        function mostrarNotaCompleta(texto) {
            document.getElementById('textoNotaCompleto').innerText = texto || 'Nenhuma anotação registrada.';
            document.getElementById('modalNotaOverlay').style.display = 'flex';
        }

        function fecharModalNota() {
            document.getElementById('modalNotaOverlay').style.display = 'none';
        }

        function gerarFiltrosDinamicos() {
            const linhasSet = new Set();
            const diasSet = new Set();
            const tiposSet = new Set();

            dadosGlobais.forEach(item => {
                const r = item.data;
                const linhaVal = formatCell(r[0]);
                const diaVal = formatCell(r[3]);
                const tipoVal = formatCell(r[2]);

                if (linhaVal) linhasSet.add(linhaVal);
                if (diaVal) diasSet.add(diaVal);
                if (tipoVal) tiposSet.add(tipoVal);
            });

            preencherContainerFiltro('filterLinhas', 'linha', Array.from(linhasSet).sort((a, b) => a.localeCompare(b, undefined, {numeric: true})));
            preencherContainerFiltro('filterDia', 'dia', Array.from(diasSet).sort((a, b) => a.localeCompare(b)));
            preencherContainerFiltro('filterTipo', 'tipo', Array.from(tiposSet).sort((a, b) => a.localeCompare(b)));

            setTimeout(atualizarPosicaoCabecalhoTabela, 50);
        }

        function preencherContainerFiltro(containerId, tipoFiltro, listaValores) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            listaValores.forEach(valor => {
                const btn = document.createElement('button');
                btn.className = 'filter-btn';
                if (filtrosAtivos[tipoFiltro].has(valor)) btn.classList.add('active');
                btn.innerText = valor;
                btn.dataset.valor = valor;
                btn.dataset.tipo = tipoFiltro;
                
                btn.onclick = (e) => tratarCliqueFiltro(tipoFiltro, valor, btn, e);
                container.appendChild(btn);
            });
        }

        function tratarCliqueFiltro(tipo, valor, elemento, event) {
            const setAtivo = filtrosAtivos[tipo];
            const botoesNoContainer = Array.from(document.querySelectorAll(`#filter${tipo.charAt(0).toUpperCase() + tipo.slice(1)} .filter-btn`));

            if (event.shiftKey && ultimoItemClicado.tipo === tipo && ultimoItemClicado.valor !== null) {
                const idxAnterior = botoesNoContainer.findIndex(b => b.dataset.valor === ultimoItemClicado.valor);
                const idxAtual = botoesNoContainer.findIndex(b => b.dataset.valor === valor);

                if (idxAnterior !== -1 && idxAtual !== -1) {
                    const inicio = Math.min(idxAnterior, idxAtual);
                    const fim = Math.max(idxAnterior, idxAtual);

                    for (let i = inicio; i <= fim; i++) {
                        const valItem = botoesNoContainer[i].dataset.valor;
                        setAtivo.add(valItem);
                        botoesNoContainer[i].classList.add('active');
                    }
                }
            } else if (event.ctrlKey || event.metaKey) {
                if (setAtivo.has(valor)) {
                    setAtivo.delete(valor);
                    elemento.classList.remove('active');
                } else {
                    setAtivo.add(valor);
                    elemento.classList.add('active');
                }
            } else {
                if (setAtivo.has(valor) && setAtivo.size === 1) {
                    setAtivo.clear();
                    elemento.classList.remove('active');
                } else {
                    setAtivo.clear();
                    botoesNoContainer.forEach(b => b.classList.remove('active'));
                    setAtivo.add(valor);
                    elemento.classList.add('active');
                }
            }

            ultimoItemClicado = { tipo, valor };
            renderizarTabela();
        }

        function renderizarTabela() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            const inputInicio = document.getElementById('dataInicio').value;
            const inputFim = document.getElementById('dataFim').value;
            const termoPesquisa = document.getElementById('inputPesquisa').value.trim();

            const dInicio = inputInicio ? new Date(inputInicio + "T00:00:00") : null;
            const dFim = inputFim ? new Date(inputFim + "T23:59:59") : null;

            const labelMetrica = document.getElementById('labelMetricaTotais');
            if (inputInicio || inputFim || termoPesquisa) {
                labelMetrica.innerText = "Alterações Filtradas";
            } else {
                labelMetrica.innerText = "Alterações Totais";
            }

            let dadosExibidos = dadosGlobais.filter(item => {
                const row = item.data;
                
                if (dInicio || dFim) {
                    const dtVigencia = parseData(row[1]);
                    if (dtVigencia) {
                        if (dInicio && dtVigencia < dInicio) return false;
                        if (dFim && dtVigencia > dFim) return false;
                    } else {
                        return false;
                    }
                }

                if (filtrosAtivos.linha.size > 0) {
                    if (!filtrosAtivos.linha.has(formatCell(row[0]))) return false;
                }

                if (filtrosAtivos.dia.size > 0) {
                    if (!filtrosAtivos.dia.has(formatCell(row[3]))) return false;
                }

                if (filtrosAtivos.tipo.size > 0) {
                    if (!filtrosAtivos.tipo.has(formatCell(row[2]))) return false;
                }

                if (apenasPendentesAtivo) {
                    const statusStr = formatCell(row[10]).toLowerCase();
                    const pendenciaVal = (statusStr === 'ok') ? 'Atualizado' : 'Pendente';
                    if (pendenciaVal !== 'Pendente') return false;
                }

                if (termoPesquisa) {
                    const matchAspas = termoPesquisa.match(/"([^"]+)"/);
                    if (matchAspas) {
                        const termoExato = matchAspas[1].toLowerCase();
                        const achouExato = row.some(celula => {
                            if (celula === null || celula === undefined) return false;
                            return celula.toString().toLowerCase().includes(termoExato);
                        });
                        if (!achouExato) return false;
                    } else {
                        const termoComum = termoPesquisa.toLowerCase();
                        const matchGlobal = row.some(celula => {
                            if (celula === null || celula === undefined) return false;
                            return celula.toString().toLowerCase().includes(termoComum);
                        });
                        if (!matchGlobal) return false;
                    }
                }

                return true;
            });

            dadosExibidos.sort((a, b) => {
                const rA = a.data;
                const rB = b.data;

                const dtA = parseData(rA[1]);
                const dtB = parseData(rB[1]);
                if (dtA && dtB) {
                    if (dtB - dtA !== 0) return dtB - dtA;
                } else {
                    const strA = (rA[1] || '').toString();
                    const strB = (rB[1] || '').toString();
                    const compVig = strB.localeCompare(strA);
                    if (compVig !== 0) return compVig;
                }

                const linhaA = formatCell(rA[0]);
                const linhaB = formatCell(rB[0]);
                const compLinha = linhaA.localeCompare(linhaB, undefined, { numeric: true });
                if (compLinha !== 0) return compLinha;

                const diaA = formatCell(rA[3]);
                const diaB = formatCell(rB[3]);
                return diaA.localeCompare(diaB, undefined, { sensitivity: 'base' });
            });

            atualizarTextoFiltrosAtivos();

            dadosExibidos.forEach((item) => {
                const row = item.data;
                const tr = document.createElement('tr');
                tr.id = `row-${item.rowIndex}`;

                if (linhasSelecionadasIds.has(item.rowIndex)) {
                    tr.classList.add('linha-selecionada');
                }
                
                tr.onclick = (e) => {
                    if (e.target.tagName === 'BUTTON' || e.target.closest('button') || e.target.tagName === 'A') return;
                    
                    if (e.ctrlKey || e.metaKey) {
                        if (linhasSelecionadasIds.has(item.rowIndex)) {
                            linhasSelecionadasIds.delete(item.rowIndex);
                            tr.classList.remove('linha-selecionada');
                        } else {
                            linhasSelecionadasIds.add(item.rowIndex);
                            tr.classList.add('linha-selecionada');
                        }
                    } else {
                        document.querySelectorAll('tbody tr').forEach(t => t.classList.remove('linha-selecionada'));
                        linhasSelecionadasIds.clear();
                        
                        linhasSelecionadasIds.add(item.rowIndex);
                        tr.classList.add('linha-selecionada');
                    }
                };

                let tdContent = '';
                
                tdContent += `<td>${formatCell(row[0])}</td>`;
                tdContent += `<td>${formatVigencia(row[1])}</td>`;
                tdContent += `<td>${formatCell(row[2])}</td>`;
                tdContent += `<td>${formatCell(row[3])}</td>`;
                tdContent += `<td>${formatCell(row[4])}</td>`;
                tdContent += `<td>${formatCell(row[5])}</td>`;
                tdContent += `<td>${formatCell(row[6])}</td>`;
                tdContent += `<td>${formatCell(row[7])}</td>`;

                const imgVal = formatCell(row[8]);
                if (imgVal && imgVal !== '-' && imgVal.startsWith('http')) {
                    tdContent += `<td><a href="${imgVal}" target="_blank" class="img-link" title="Clique para abrir a imagem">🖼️ Imagem Disponível</a></td>`;
                } else {
                    tdContent += `<td>${imgVal}</td>`;
                }

                const anotacaoVal = formatCell(row[9]);
                if (anotacaoVal && anotacaoVal !== '-') {
                    const textoEscapado = anotacaoVal.replace(/'/g, "\\'").replace(/"/g, '&quot;').replace(/\n/g, '\\n');
                    tdContent += `<td>
                        <div class="anotacao-badge" onclick="mostrarNotaCompleta('${textoEscapado}')" title="Clique para ler o comentário completo">
                            📝 Comentário Disponível
                        </div>
                    </td>`;
                } else {
                    tdContent += `<td>${anotacaoVal}</td>`;
                }

                tdContent += `<td>${formatCell(row[10])}</td>`;

                const statusStr = formatCell(row[10]).toLowerCase();
                const pendenciaVal = (statusStr === 'ok') ? 'Atualizado' : 'Pendente';
                const badgeClass = (pendenciaVal === 'Atualizado') ? 'badge-atualizado' : 'badge-pendente';
                tdContent += `<td><span class="badge-status ${badgeClass}">${pendenciaVal}</span></td>`;

                tdContent += `
                    <td>
                        <button class="btn btn-outline btn-sm" onclick="editarRegistro(${item.rowIndex})">Editar</button>
                    </td>
                `;

                tr.innerHTML = tdContent;
                tbody.appendChild(tr);
            });

            atualizarMetricas(dadosExibidos);
        }

        function filtrarPendentesToggle() {
            apenasPendentesAtivo = !apenasPendentesAtivo;
            const btn = document.getElementById('btnFiltrarPendentes');
            
            if (apenasPendentesAtivo) {
                btn.classList.add('active');
                btn.style.backgroundColor = 'var(--primary)';
                btn.style.color = 'white';
            } else {
                btn.classList.remove('active');
                btn.style.backgroundColor = 'transparent';
                btn.style.color = 'var(--text-muted)';
            }

            renderizarTabela();
        }

        function atualizarTextoFiltrosAtivos() {
            let partes = [];
            const termoPesquisa = document.getElementById('inputPesquisa').value.trim();
            if (termoPesquisa) partes.push(`Busca: "${termoPesquisa}"`);
            if (apenasPendentesAtivo) partes.push('Apenas Pendentes');
            if (filtrosAtivos.linha.size > 0) partes.push(`Linhas (${filtrosAtivos.linha.size})`);
            if (filtrosAtivos.tipo.size > 0) partes.push(`Tipos (${filtrosAtivos.tipo.size})`);
            if (filtrosAtivos.dia.size > 0) partes.push(`Dias (${filtrosAtivos.dia.size})`);
            
            document.getElementById('filtroAtivoLabel').innerText = partes.join(' | ');
        }

        function limparFiltroData() {
            document.getElementById('dataInicio').value = '';
            document.getElementById('dataFim').value = '';
            renderizarTabela();
        }

        function limparFiltros() {
            filtrosAtivos.linha.clear();
            filtrosAtivos.dia.clear();
            filtrosAtivos.tipo.clear();
            apenasPendentesAtivo = false;
            document.getElementById('inputPesquisa').value = '';
            linhasSelecionadasIds.clear();
            
            const btnPendentes = document.getElementById('btnFiltrarPendentes');
            btnPendentes.classList.remove('active');
            btnPendentes.style.backgroundColor = 'transparent';
            btnPendentes.style.color = 'var(--text-muted)';

            limparFiltroData();
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('filtroAtivoLabel').innerText = '';
            renderizarTabela();
        }

        function atualizarMetricas(dados) {
            document.getElementById('mTotGeral').innerText = dados.length;
            
            let pendMobi = 0;
            let pendTerm = 0;
            let pendAvis = 0;
            let pendAgen = 0;

            dados.forEach(d => {
                const r = d.data;
                const statusVal = formatCell(r[10]).toLowerCase();

                if (statusVal === 'ok') return;

                if (!formatCell(r[4]) || formatCell(r[4]) === '-') pendMobi++;
                if (!formatCell(r[5]) || formatCell(r[5]) === '-') pendTerm++;
                if (!formatCell(r[6]) || formatCell(r[6]) === '-') pendAvis++;
                if (!formatCell(r[7]) || formatCell(r[7]) === '-') pendAgen++;
            });

            const atualizarElementoMetrica = (id, valor) => {
                const el = document.getElementById(id);
                el.innerText = valor;
                if (valor === 0) {
                    el.className = 'val green';
                } else {
                    el.className = 'val red';
                }
            };

            atualizarElementoMetrica('mPendMobi', pendMobi);
            atualizarElementoMetrica('mPendTerm', pendTerm);
            atualizarElementoMetrica('mPendAvis', pendAvis);
            atualizarElementoMetrica('mPendAgen', pendAgen);
        }

        function abrirModal() {
            document.getElementById('modalTitle').innerText = 'Adicionar Nova Linha';
            document.getElementById('editRowIndex').value = '';
            document.getElementById('dataForm').reset();
            document.getElementById('btnDeletarRegistro').style.display = 'none';
            document.getElementById('modalOverlay').style.display = 'flex';
        }

        function fecharModal() {
            document.getElementById('modalOverlay').style.display = 'none';
        }

        function editarRegistro(rowIndex) {
            const registro = dadosGlobais.find(d => d.rowIndex === rowIndex);
            if (!registro) return;

            const r = registro.data;
            document.getElementById('modalTitle').innerText = `Editar Registro (Linha ${rowIndex})`;
            document.getElementById('editRowIndex').value = rowIndex;

            document.getElementById('fLinha').value = r[0] || '';
            document.getElementById('fVigencia').value = formatToInputDate(r[1]);
            document.getElementById('fTipo').value = r[2] || '';
            document.getElementById('fDia').value = r[3] || '';
            document.getElementById('fMobilibus').value = r[4] || '';
            document.getElementById('fTerminais').value = r[5] || '';
            document.getElementById('fAvisos').value = r[6] || '';
            document.getElementById('fAgencia').value = r[7] || '';
            document.getElementById('fImagem').value = r[8] || '';
            document.getElementById('fAnotacoes').value = r[9] || '';
            document.getElementById('fStatus').value = r[10] || '';

            document.getElementById('btnDeletarRegistro').style.display = 'inline-block';
            document.getElementById('modalOverlay').style.display = 'flex';
        }

        async function deletarRegistro() {
            const targetRow = document.getElementById('editRowIndex').value;
            if (!targetRow) return;

            if (!confirm(`Tem certeza de que deseja excluir o registro da Linha ${targetRow}?`)) {
                return;
            }

            document.getElementById('statusNuvem').innerText = "Excluindo...";

            const payload = {
                aba: abaAtual,
                rowIndex: targetRow,
                col1: "", col2: "", col3: "", col4: "", col5: "",
                col6: "", col7: "", col8: "", col9: "", col10: "",
                col11: "", col12: ""
            };

            try {
                await fetch(WEB_APP_BASE_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });

                fecharModal();
                setTimeout(carregarDados, 1500);
            } catch (err) {
                console.error("Erro ao excluir:", err);
                alert("Erro ao excluir o registro na nuvem.");
            }
        }

        async function salvarRegistro(event) {
            event.preventDefault();

            const targetRow = document.getElementById('editRowIndex').value;
            const stat = document.getElementById('fStatus').value.trim();

            const pendenciaCalculada = (stat.toLowerCase() === 'ok') ? 'Atualizado' : 'Pendente';

            const vigenciaInput = document.getElementById('fVigencia').value;
            let vigenciaFormatada = vigenciaInput;
            if (vigenciaInput && vigenciaInput.includes('-')) {
                const p = vigenciaInput.split('-');
                vigenciaFormatada = `${p[2]}/${p[1]}/${p[0]}`;
            }

            const payload = {
                aba: abaAtual,
                rowIndex: targetRow,
                col1: document.getElementById('fLinha').value,
                col2: vigenciaFormatada,
                col3: document.getElementById('fTipo').value,
                col4: document.getElementById('fDia').value,
                col5: document.getElementById('fMobilibus').value.trim(),
                col6: document.getElementById('fTerminais').value.trim(),
                col7: document.getElementById('fAvisos').value.trim(),
                col8: document.getElementById('fAgencia').value.trim(),
                col9: document.getElementById('fImagem').value.trim(),
                col10: document.getElementById('fAnotacoes').value,
                col11: stat,
                col12: pendenciaCalculada
            };

            ultimaLinhaSalvaId = targetRow ? parseInt(targetRow) : 2;
            if (targetRow) {
                linhasSelecionadasIds.clear();
                linhasSelecionadasIds.add(parseInt(targetRow));
            }

            document.getElementById('statusNuvem').innerText = "Salvando...";

            try {
                await fetch(WEB_APP_BASE_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });

                fecharModal();
                setTimeout(carregarDados, 1500);
            } catch (err) {
                console.error("Erro ao salvar:", err);
                alert("Erro ao salvar dados na nuvem.");
            }
        }
    </script>
